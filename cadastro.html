<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estacionamento - Cadastro</title>
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Controle de Estacionamento</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Listar Vagas</a></li>
                    <li><a href="cadastro.html" class="active">Cadastrar Reserva</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="cadastro-vaga">
            <h2>Cadastro de Reserva de Vaga</h2>
            <form id="form-vaga">
                <div class="form-group">
                    <label for="placa">Placa do Veículo:</label>
                    <input type="text" id="placa" name="placa" required>
                </div>
                
                <div class="form-group">
                    <label for="proprietario">Nome do Proprietário:</label>
                    <input type="text" id="proprietario" name="proprietario" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="apartamento">Número do Apartamento:</label>
                        <input type="number" id="apartamento" name="apartamento" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="bloco">Bloco do Apartamento:</label>
                        <input type="text" id="bloco" name="bloco" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="modelo">Modelo do Veículo:</label>
                        <input type="text" id="modelo" name="modelo" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="cor">Cor do Veículo:</label>
                        <input type="text" id="cor" name="cor" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="numeroVaga">Número da Vaga:</label>
                    <input type="number" id="numeroVaga" name="numeroVaga" required>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Salvar</button>
                    <button type="reset" class="btn">Limpar</button>
                </div>
            </form>
        </section>

        <div id="mensagem-view"></div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 - Sistema de Controle de Estacionamento</p>
        </div>
    </footer>

    <script src="js/models/Vaga.js"></script>
    <script src="js/views/MensagemView.js"></script>
    <script src="js/services/VagaService.js"></script>
    <script src="js/controllers/VagaController.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
